; Shell Reveal & Counter (Single-player HUD mod for Buckshot Roulette)
; Loads shell-reveal-counter/loader.gd. Two entries: one for Steam launches, one for direct launches.
; To uninstall: delete this file and the shell-reveal-counter folder.

[autoload]

ShellRevealCounter="*res://shell-reveal-counter/loader.gd"
ShellRevealCounterSteam="*res://Buckshot Roulette_windows/shell-reveal-counter/loader.gd"